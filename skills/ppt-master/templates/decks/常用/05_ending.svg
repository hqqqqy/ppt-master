<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Full-page background -->
  <image href="cover_bg.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="none"/>

  <!-- Top-left: blue accent bar -->
  <line x1="68" y1="51" x2="128" y2="51" stroke-width="6.667" stroke="#0B88FF" fill="none"/>

  <!-- Top-left: project-type badge -->
  <text x="67" y="84" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="18.67" fill="#000000" font-weight="bold">CROSS BORDER</text>
  <text x="67" y="103" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="18.67" fill="#000000" font-weight="bold">E-COMMERCE</text>

  <!-- Top-right: brand emblem -->
  <image href="brand_emblem.png" x="1149" y="46" width="69" height="69" preserveAspectRatio="none"/>

  <!-- Center: ghost EN thank-you -->
  <rect x="196" y="187" width="887" height="278" fill="none"/>
  <text x="206" y="380" text-anchor="start" font-family="&quot;Tw Cen MT Condensed Extra Bold&quot;, sans-serif" font-size="221.33" fill="#F2F2F2" fill-opacity="0.85" font-weight="bold">{{THANK_YOU}}</text>

  <!-- Center: Chinese closing message -->
  <rect x="196" y="359" width="887" height="88" fill="none"/>
  <text x="206" y="419" text-anchor="start" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="64" fill="#000000" font-weight="bold">{{CLOSING_MESSAGE}}</text>

  <!-- Bottom-left: blue bar + badge -->
  <line x1="68" y1="671" x2="128" y2="671" stroke-width="6.667" stroke="#0B88FF" fill="none"/>
  <text x="67" y="628" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="18.67" fill="#000000" font-weight="bold">CASE STUDY</text>
  <text x="67" y="647" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="18.67" fill="#000000" font-weight="bold">RESEARCH.</text>

  <!-- Bottom-right: date display -->
  <text x="1092" y="672" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="18.67" fill="#000000" font-weight="bold">MAR.</text>
  <text x="1143" y="667" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="64" fill="#000000" font-weight="bold">{{YEAR}}</text>
</svg>
