<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <filter id="card-shadow1" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="2.83" dy="2.83" stdDeviation="3.33" flood-color="#000000" flood-opacity="0.3"/></filter>
    <filter id="card-shadow2" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="2.83" dy="2.83" stdDeviation="3.33" flood-color="#000000" flood-opacity="0.3"/></filter>
  </defs>
  <image href="cover_bg.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="none"/>
  <!-- SHARED CHROME -->
  <line x1="68" y1="51" x2="128" y2="51" stroke-width="6.667" stroke="#0B88FF" fill="none"/>
  <image href="brand_emblem.png" x="1149" y="46" width="69" height="69" preserveAspectRatio="none"/>
  <line x1="68" y1="671" x2="128" y2="671" stroke-width="6.667" stroke="#0B88FF" fill="none"/>
  <text x="67" y="628" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="18.67" fill="#000000" font-weight="bold">CASE STUDY</text>
  <text x="67" y="647" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="18.67" fill="#000000" font-weight="bold">RESEARCH.</text>
  <text x="71" y="95" font-family="&quot;Tw Cen MT Condensed Extra Bold&quot;, sans-serif" font-size="29.33" fill="#000000" font-weight="bold">{{SECTION_NUM}}</text>
  <text x="120" y="96" font-family="&quot;碳纤维正中黑简体&quot;, sans-serif" font-size="26.67" fill="#000000" font-weight="bold">{{PAGE_TITLE}}</text>
  <text x="1213" y="638" text-anchor="end" font-family="&quot;碳纤维正中黑简体&quot;, sans-serif" font-size="26.67" fill="#0B88FF" font-weight="bold" font-style="italic" letter-spacing="2.67">{{SECTION_NAME}}</text>
  <line x1="964" y1="631" x2="1120" y2="631" stroke-width="2.667" stroke="#0B88FF" fill="none"/>
  <text x="841" y="685" font-family="&quot;Tw Cen MT Condensed Extra Bold&quot;, sans-serif" font-size="48" fill="#F2F2F2" font-style="italic">{{SECTION_EN}}</text>

  <!-- Left card (white, shadow) -->
  <g filter="url(#card-shadow1)">
    <rect x="68" y="135" width="518" height="456" rx="13" fill="#FFFFFF"/>
  </g>
  <!-- Left card bottom accent bar (blue) -->
  <rect x="152" y="570" width="350" height="15" rx="7" fill="#0B88FF"/>
  <!-- Left card icon area -->
  <rect x="68" y="135" width="518" height="100" rx="13" fill="none"/>
  <text x="327" y="200" text-anchor="middle" font-family="&quot;Tw Cen MT Condensed Extra Bold&quot;, sans-serif" font-size="48" fill="#0B88FF" font-weight="bold">{{CARD1_ICON}}</text>
  <!-- Left card heading -->
  <text x="251" y="270" text-anchor="middle" font-family="&quot;方正宋刻本秀楷简体&quot;, serif" font-size="32" fill="#000000" font-weight="bold">{{CARD1_TITLE}}</text>
  <!-- Left card body -->
  <rect x="142" y="285" width="370" height="270" fill="none"/>
  <text x="327" y="310" text-anchor="middle" font-family="&quot;方正宋刻本秀楷简体&quot;, serif" font-size="26.67" fill="#000000">{{CARD1_CONTENT}}</text>

  <!-- Right card (white, shadow) -->
  <g filter="url(#card-shadow2)">
    <rect x="700" y="135" width="518" height="456" rx="13" fill="#FFFFFF"/>
  </g>
  <!-- Right card bottom accent bar (black) -->
  <rect x="784" y="570" width="350" height="15" rx="7" fill="#000000"/>
  <!-- Right card icon area -->
  <text x="959" y="200" text-anchor="middle" font-family="&quot;Tw Cen MT Condensed Extra Bold&quot;, sans-serif" font-size="48" fill="#0B88FF" font-weight="bold">{{CARD2_ICON}}</text>
  <!-- Right card heading -->
  <text x="883" y="270" text-anchor="middle" font-family="&quot;方正宋刻本秀楷简体&quot;, serif" font-size="32" fill="#000000" font-weight="bold">{{CARD2_TITLE}}</text>
  <!-- Right card body -->
  <rect x="775" y="285" width="370" height="270" fill="none"/>
  <text x="959" y="310" text-anchor="middle" font-family="&quot;方正宋刻本秀楷简体&quot;, serif" font-size="26.67" fill="#000000">{{CARD2_CONTENT}}</text>

  <!-- Content area placeholder -->
  <text x="640" y="460" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#BFBFBF">{{CONTENT_AREA}}</text>
</svg>
