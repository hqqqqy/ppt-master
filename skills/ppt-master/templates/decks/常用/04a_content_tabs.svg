<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Full-page background -->
  <image href="cover_bg.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="none"/>

  <!-- ═══ SHARED CHROME ═══ -->
  <line x1="68" y1="51" x2="128" y2="51" stroke-width="6.667" stroke="#0B88FF" fill="none"/>
  <image href="brand_emblem.png" x="1149" y="46" width="69" height="69" preserveAspectRatio="none"/>
  <line x1="68" y1="671" x2="128" y2="671" stroke-width="6.667" stroke="#0B88FF" fill="none"/>
  <text x="67" y="628" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="18.67" fill="#000000" font-weight="bold">CASE STUDY</text>
  <text x="67" y="647" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="18.67" fill="#000000" font-weight="bold">RESEARCH.</text>

  <!-- Section header top-left -->
  <text x="71" y="95" font-family="&quot;Tw Cen MT Condensed Extra Bold&quot;, sans-serif" font-size="29.33" fill="#000000" font-weight="bold">{{SECTION_NUM}}</text>
  <text x="120" y="96" font-family="&quot;碳纤维正中黑简体&quot;, sans-serif" font-size="26.67" fill="#000000" font-weight="bold">{{PAGE_TITLE}}</text>

  <!-- Section footer bottom-right -->
  <text x="1213" y="638" text-anchor="end" font-family="&quot;碳纤维正中黑简体&quot;, sans-serif" font-size="26.67" fill="#0B88FF" font-weight="bold" font-style="italic" letter-spacing="2.67">{{SECTION_NAME}}</text>
  <line x1="964" y1="631" x2="1120" y2="631" stroke-width="2.667" stroke="#0B88FF" fill="none"/>
  <text x="841" y="685" font-family="&quot;Tw Cen MT Condensed Extra Bold&quot;, sans-serif" font-size="48" fill="#F2F2F2" font-style="italic">{{SECTION_EN}}</text>

  <!-- Lead-in text row (optional full-width subtitle) -->
  <rect x="68" y="130" width="1150" height="75" fill="none"/>
  <text x="78" y="158" font-family="&quot;方正宋刻本秀楷简体&quot;, serif" font-size="26.67" fill="#000000">{{LEAD_IN_TEXT}}</text>

  <!-- 3-tab navigation bar -->
  <line x1="156" y1="325" x2="1108" y2="325" stroke-width="1.333" stroke="#D9D9D9" fill="none"/>

  <!-- Tab 1 — ACTIVE -->
  <text x="238" y="308" text-anchor="middle" font-family="&quot;方正宋刻本秀楷简体&quot;, serif" font-size="32" fill="#000000" font-weight="bold">{{TAB1_LABEL}}</text>
  <rect x="156" y="322" width="164" height="4.8" rx="2.4" fill="#0B88FF"/>

  <!-- Tab 2 -->
  <text x="643" y="308" text-anchor="middle" font-family="&quot;方正宋刻本秀楷简体&quot;, serif" font-size="32" fill="#000000" font-weight="bold">{{TAB2_LABEL}}</text>
  <rect x="561" y="322" width="164" height="4.8" rx="2.4" fill="#D9D9D9"/>

  <!-- Tab 3 -->
  <text x="1025" y="308" text-anchor="middle" font-family="&quot;方正宋刻本秀楷简体&quot;, serif" font-size="32" fill="#000000" font-weight="bold">{{TAB3_LABEL}}</text>
  <rect x="943" y="322" width="164" height="4.8" rx="2.4" fill="#D9D9D9"/>

  <!-- 3-column content area (below tabs) -->
  <!-- Column dividers (dashed) -->
  <line x1="428" y1="330" x2="428" y2="590" stroke-width="1.333" stroke="#D9D9D9" stroke-dasharray="4 4" fill="none"/>
  <line x1="852" y1="330" x2="852" y2="590" stroke-width="1.333" stroke="#D9D9D9" stroke-dasharray="4 4" fill="none"/>

  <!-- Col 1 content -->
  <rect x="68" y="345" width="340" height="240" fill="none"/>
  <text x="78" y="373" font-family="&quot;方正宋刻本秀楷简体&quot;, serif" font-size="26.67" fill="#000000">{{COL1_CONTENT}}</text>

  <!-- Col 2 content -->
  <rect x="458" y="345" width="340" height="240" fill="none"/>
  <text x="468" y="373" font-family="&quot;方正宋刻本秀楷简体&quot;, serif" font-size="26.67" fill="#000000">{{COL2_CONTENT}}</text>

  <!-- Col 3 content -->
  <rect x="882" y="345" width="310" height="240" fill="none"/>
  <text x="892" y="373" font-family="&quot;方正宋刻本秀楷简体&quot;, serif" font-size="26.67" fill="#000000">{{COL3_CONTENT}}</text>

  <!-- Content area placeholder -->
  <text x="640" y="460" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#BFBFBF">{{CONTENT_AREA}}</text>
</svg>
