  <!-- Item 1 (top) -->
  <path d="M 123 135 L 345 135 L 341 173 L 340 173 L 344 137 L 124 137 L 112 272 L 331 272 L 335 236 L 336 236 L 332 274 L 110 274 L 123 135 Z" fill="#E7E6E6" stroke="none"/>
  <polygon points="139,142 334,142 316,267 121,267" fill="none" stroke-width="2" stroke="#D9D9D9"/>
  <polygon points="338,169 345,169 344,174 337,174" fill="#0B88FF" stroke="none"/>
  <polygon points="332,233 339,233 338,237 331,237" fill="#0B88FF" stroke="none"/>
