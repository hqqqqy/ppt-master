  <polygon points="139,305 334,305 316,430 121,430" fill="none" stroke-width="2" stroke="#D9D9D9"/>
  <polygon points="338,332 345,332 344,337 337,337" fill="#0B88FF" stroke="none"/>
  <polygon points="332,396 339,396 338,400 331,400" fill="#0B88FF" stroke="none"/>
  <text x="160" y="347" font-family="&quot;Tw Cen MT Condensed Extra Bold&quot;, sans-serif" font-size="32" fill="#000000">{{ITEM2_TITLE}}</text>
  <text x="232" y="387" text-anchor="middle" font-family="&quot;方正宋刻本秀楷简体&quot;, serif" font-size="24" fill="#000000">{{ITEM2_BRIEF}}</text>

  <!-- Item 3 (bottom) -->
  <path d="M 123 460 L 345 460 L 341 499 L 340 499 L 344 462 L 124 462 L 112 598 L 331 598 L 335 561 L 336 561 L 332 599 L 110 599 L 123 460 Z" fill="#E7E6E6" stroke="none"/>
  <polygon points="139,467 334,467 316,592 121,592" fill="none" stroke-width="2" stroke="#D9D9D9"/>
  <polygon points="338,495 345,495 344,499 337,499" fill="#0B88FF" stroke="none"/>
  <polygon points="332,558 339,558 338,563 331,563" fill="#0B88FF" stroke="none"/>
  <text x="160" y="510" font-family="&quot;Tw Cen MT Condensed Extra Bold&quot;, sans-serif" font-size="32" fill="#000000">{{ITEM3_TITLE}}</text>
  <text x="232" y="549" text-anchor="middle" font-family="&quot;方正宋刻本秀楷简体&quot;, serif" font-size="24" fill="#000000">{{ITEM3_BRIEF}}</text>

  <!-- Arrow connectors (left → right) -->
  <line x1="369" y1="204" x2="469" y2="204" stroke="#D9D9D9" marker-end="url(#arrow1)" stroke-width="1"/>
  <line x1="369" y1="366" x2="469" y2="366" stroke="#D9D9D9" marker-end="url(#arrow2)" stroke-width="1"/>
  <line x1="369" y1="528" x2="469" y2="528" stroke="#D9D9D9" marker-end="url(#arrow3)" stroke-width="1"/>

  <!-- Right column: 3 detail text blocks -->
  <rect x="491" y="156" width="728" height="97" fill="none"/>
  <text x="501" y="181" font-family="&quot;方正宋刻本秀楷简体&quot;, serif" font-size="24" fill="#000000">{{ITEM1_CONTENT}}</text>

  <rect x="491" y="318" width="728" height="97" fill="none"/>
  <text x="501" y="343" font-family="&quot;方正宋刻本秀楷简体&quot;, serif" font-size="24" fill="#000000">{{ITEM2_CONTENT}}</text>

  <rect x="491" y="480" width="728" height="97" fill="none"/>
  <text x="501" y="505" font-family="&quot;方正宋刻本秀楷简体&quot;, serif" font-size="24" fill="#000000">{{ITEM3_CONTENT}}</text>

  <!-- Content area placeholder -->
  <text x="860" y="430" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#BFBFBF">{{CONTENT_AREA}}</text>
