<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
  <image href="bg_tiled.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="none"/>
  <!-- Top chrome -->
  <line x1="68" y1="51" x2="128" y2="51" stroke-width="6.667" stroke="#0B88FF"/>
  <text x="71" y="95" font-family="&quot;Tw Cen MT Condensed Extra Bold&quot;,sans-serif" font-size="29.33" fill="#000000" font-weight="bold">{{SECTION_NUM}}</text>
  <text x="120" y="96" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="26.67" fill="#000000" font-weight="bold">{{SECTION_TITLE}}</text>
  <image href="brand_logo.png" x="1149" y="46" width="69" height="69" preserveAspectRatio="none"/>
  <!-- Bottom chrome -->
  <line x1="68" y1="671" x2="128" y2="671" stroke-width="6.667" stroke="#0B88FF"/>
  <text x="67" y="628" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="18.67" fill="#000000" font-weight="bold">THESIS</text>
  <text x="67" y="647" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="18.67" fill="#000000" font-weight="bold">DEFENSE.</text>
  <line x1="964" y1="631" x2="1121" y2="631" stroke-width="2.667" stroke="#0B88FF"/>
  <text x="1213" y="638" text-anchor="end" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="26.67" fill="#0B88FF" font-weight="bold" font-style="italic" letter-spacing="2.67">{{CHAP_LABEL_BLUE}}</text>
  <text x="833" y="685" font-family="&quot;Tw Cen MT Condensed Extra Bold&quot;,sans-serif" font-size="48" fill="#F2F2F2" font-style="italic">{{CHAP_LABEL_EN}}</text>
  <!-- Intro paragraph -->
  <rect x="68" y="130" width="1150" height="75" fill="none"/>
  <text x="78" y="158" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="26.67" fill="#000000">{{INTRO_PARAGRAPH}}</text>
  <!-- Dashed horizontal separator -->
  <line x1="68" y1="223" x2="1203" y2="223" stroke-width="1.333" stroke="#D9D9D9" stroke-dasharray="4 4"/>
  <!-- Two vertical dashed dividers splitting 3 columns -->
  <line x1="428" y1="224" x2="428" y2="461" stroke-width="1.333" stroke="#D9D9D9" stroke-dasharray="4 4"/>
  <line x1="852" y1="224" x2="852" y2="461" stroke-width="1.333" stroke="#D9D9D9" stroke-dasharray="4 4"/>
  <!-- Column 1 -->
  <g id="col1">
    <rect x="68" y="249" width="340" height="75" fill="none"/>
    <text x="78" y="277" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="26.67" fill="#000000">{{COL1_POINT_1}}</text>
    <rect x="68" y="324" width="340" height="75" fill="none"/>
    <text x="78" y="352" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="26.67" fill="#000000">{{COL1_POINT_2}}</text>
    <rect x="68" y="399" width="340" height="75" fill="none"/>
    <text x="78" y="427" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="26.67" fill="#000000">{{COL1_POINT_3}}</text>
    <text x="236" y="276" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="26.67" fill="#000000" font-weight="bold">{{COL1_TITLE}}</text>
    <text x="236" y="230" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="26.67" fill="#0B88FF" font-weight="bold">{{COL1_SUBTITLE}}</text>
  </g>
  <!-- Column 2 -->
  <g id="col2">
    <text x="536" y="230" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="26.67" fill="#0B88FF" font-weight="bold">{{COL2_SUBTITLE}}</text>
    <text x="536" y="276" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="26.67" fill="#000000" font-weight="bold">{{COL2_TITLE}}</text>
    <rect x="492" y="299" width="340" height="200" fill="none"/>
    <text x="502" y="327" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="26.67" fill="#000000">{{COL2_BODY}}</text>
  </g>
  <!-- Column 3 -->
  <g id="col3">
    <text x="917" y="230" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="26.67" fill="#0B88FF" font-weight="bold">{{COL3_SUBTITLE}}</text>
    <text x="917" y="276" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="26.67" fill="#000000" font-weight="bold">{{COL3_TITLE}}</text>
    <rect x="917" y="299" width="286" height="200" fill="none"/>
    <text x="927" y="327" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="26.67" fill="#000000">{{COL3_BODY}}</text>
  </g>
  <!-- Content area label -->
  <rect x="68" y="475" width="1150" height="120" fill="none"/>
  <text x="78" y="505" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="26.67" fill="#000000">{{CONTENT_AREA}}</text>
</svg>
