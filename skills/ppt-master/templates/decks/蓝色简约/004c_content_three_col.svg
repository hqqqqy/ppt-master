<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
  <image href="bg_tiled.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="none"/>
  <line x1="68" y1="51" x2="128" y2="51" stroke-width="6.667" stroke="#0B88FF"/>
  <text x="71" y="95" font-family="&quot;Tw Cen MT Condensed Extra Bold&quot;,sans-serif" font-size="29.33" fill="#000000" font-weight="bold">{{SECTION_NUM}}</text>
  <text x="120" y="96" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="26.67" fill="#000000" font-weight="bold">{{SECTION_TITLE}}</text>
  <image href="brand_logo.png" x="1149" y="46" width="69" height="69" preserveAspectRatio="none"/>
  <line x1="68" y1="671" x2="128" y2="671" stroke-width="6.667" stroke="#0B88FF"/>
  <text x="67" y="628" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="18.67" fill="#000000" font-weight="bold">THESIS</text>
  <text x="67" y="647" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="18.67" fill="#000000" font-weight="bold">DEFENSE.</text>
  <line x1="964" y1="631" x2="1121" y2="631" stroke-width="2.667" stroke="#0B88FF"/>
  <text x="1213" y="638" text-anchor="end" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="26.67" fill="#0B88FF" font-weight="bold" font-style="italic" letter-spacing="2.67">{{CHAP_LABEL_BLUE}}</text>
  <text x="833" y="685" font-family="&quot;Tw Cen MT Condensed Extra Bold&quot;,sans-serif" font-size="48" fill="#F2F2F2" font-style="italic">{{CHAP_LABEL_EN}}</text>
  <!-- 3 icon cards with bottom parallelogram labels -->
  <!-- Card 1 -->
  <g id="card1">
    <rect x="68" y="130" width="340" height="350" rx="8" ry="8" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/>
    <rect x="152" y="463" width="173" height="12" rx="6" ry="6" fill="#0B88FF"/>
    <!-- Icon placeholder -->
    <rect x="200" y="160" width="80" height="80" rx="40" ry="40" fill="#0B88FF"/>
    <text x="240" y="210" text-anchor="middle" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="32" fill="#FFFFFF" font-weight="bold">{{ICON_1}}</text>
    <!-- Title -->
    <text x="238" y="275" text-anchor="middle" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="28" fill="#000000" font-weight="bold">{{CARD1_TITLE}}</text>
    <!-- Body -->
    <rect x="88" y="295" width="300" height="155" fill="none"/>
    <text x="238" y="320" text-anchor="middle" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="22" fill="#000000">{{CARD1_BODY}}</text>
  </g>
  <!-- Card 2 -->
  <g id="card2">
    <rect x="470" y="130" width="340" height="350" rx="8" ry="8" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/>
    <rect x="554" y="463" width="173" height="12" rx="6" ry="6" fill="#0B88FF"/>
    <rect x="600" y="160" width="80" height="80" rx="40" ry="40" fill="#0B88FF"/>
    <text x="640" y="210" text-anchor="middle" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="32" fill="#FFFFFF" font-weight="bold">{{ICON_2}}</text>
    <text x="640" y="275" text-anchor="middle" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="28" fill="#000000" font-weight="bold">{{CARD2_TITLE}}</text>
    <rect x="490" y="295" width="300" height="155" fill="none"/>
    <text x="640" y="320" text-anchor="middle" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="22" fill="#000000">{{CARD2_BODY}}</text>
  </g>
  <!-- Card 3 -->
  <g id="card3">
    <rect x="872" y="130" width="340" height="350" rx="8" ry="8" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/>
    <rect x="956" y="463" width="173" height="12" rx="6" ry="6" fill="#0B88FF"/>
    <rect x="1002" y="160" width="80" height="80" rx="40" ry="40" fill="#0B88FF"/>
    <text x="1042" y="210" text-anchor="middle" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="32" fill="#FFFFFF" font-weight="bold">{{ICON_3}}</text>
    <text x="1042" y="275" text-anchor="middle" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="28" fill="#000000" font-weight="bold">{{CARD3_TITLE}}</text>
    <rect x="892" y="295" width="300" height="155" fill="none"/>
    <text x="1042" y="320" text-anchor="middle" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="22" fill="#000000">{{CARD3_BODY}}</text>
  </g>
  <!-- Bottom parallelogram labels -->
  <polygon points="142,502 363,502 290,563 68,563" fill="#0B88FF"/>
  <text x="215" y="540" text-anchor="middle" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="26" fill="#000000" font-weight="bold">{{BAR_LABEL_1}}</text>
  <polygon points="544,502 765,502 692,563 470,563" fill="#0B88FF" fill-opacity="0.7"/>
  <text x="617" y="540" text-anchor="middle" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="26" fill="#000000" font-weight="bold">{{BAR_LABEL_2}}</text>
  <polygon points="946,502 1167,502 1094,563 872,563" fill="#0B88FF" fill-opacity="0.45"/>
  <text x="1019" y="540" text-anchor="middle" font-family="&quot;微软雅黑&quot;,sans-serif" font-size="26" fill="#000000" font-weight="bold">{{BAR_LABEL_3}}</text>
</svg>
