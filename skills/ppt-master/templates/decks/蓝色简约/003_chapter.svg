<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Background -->
  <image href="bg_tiled.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="none"/>

  <!-- Top chrome -->
  <line x1="68" y1="51" x2="128" y2="51" stroke-width="6.667" stroke="#0B88FF" fill="#0B88FF"/>
  <g id="page-header">
    <text x="71" y="95" text-anchor="start" xml:space="preserve" font-family="&quot;Tw Cen MT Condensed Extra Bold&quot;, sans-serif" font-size="29.33" fill="#000000" font-weight="bold">{{SECTION_NUM}}</text>
    <text x="120" y="96" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="26.67" fill="#000000" font-weight="bold">{{SECTION_TITLE}}</text>
  </g>
  <image href="brand_logo.png" x="1149" y="46" width="69" height="69" preserveAspectRatio="none"/>

  <!-- Bottom chrome -->
  <line x1="68" y1="671" x2="128" y2="671" stroke-width="6.667" stroke="#0B88FF" fill="#0B88FF"/>
  <g id="bottom-left-brand">
    <text x="67" y="628" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="18.67" fill="#000000" font-weight="bold">THESIS</text>
    <text x="67" y="647" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="18.67" fill="#000000" font-weight="bold">DEFENSE.</text>
  </g>

  <!-- Bottom-right chapter indicator (active chapter name) -->
  <text x="1213" y="638" text-anchor="end" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="26.67" fill="#0B88FF" font-weight="bold" font-style="italic" letter-spacing="2.67">{{CHAPTER_LABEL_CN_BLUE}}</text>
  <text x="1213" y="638" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="26.67" fill="#000000" font-weight="bold" font-style="italic" letter-spacing="2.67">{{CHAPTER_LABEL_CN_BLACK}}</text>
  <line x1="924" y1="631" x2="1080" y2="631" stroke-width="2.667" stroke="#0B88FF" fill="#0B88FF"/>
  <text x="833" y="685" text-anchor="start" xml:space="preserve" font-family="&quot;Tw Cen MT Condensed Extra Bold&quot;, sans-serif" font-size="48" fill="#F2F2F2" font-style="italic">{{CHAPTER_LABEL_EN}}</text>

  <!-- Optional intro text block at top -->
  <g id="intro-text">
    <rect x="68" y="130" width="1150" height="75" fill="none"/>
    <text x="78" y="158" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="26.67" fill="#000000">{{INTRO_TEXT}}</text>
  </g>

  <!-- 3 parallelogram bars at bottom center — chapter callout banners -->
  <!-- Bar 1 (active / highlight) -->
  <polygon points="142,502 363,502 290,563 68,563" fill="#0B88FF"/>
  <text x="158" y="540" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="32" fill="#000000" font-weight="bold">{{BAR_LABEL_1}}</text>

  <!-- Bar 2 -->
  <polygon points="566,502 788,502 714,563 492,563" fill="#0B88FF" fill-opacity="0.65"/>
  <text x="583" y="540" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="32" fill="#000000" font-weight="bold">{{BAR_LABEL_2}}</text>

  <!-- Bar 3 -->
  <polygon points="997,502 1218,502 1145,563 923,563" fill="#0B88FF" fill-opacity="0.35"/>
  <text x="1013" y="540" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="32" fill="#000000" font-weight="bold">{{BAR_LABEL_3}}</text>

  <!-- Content area: large chapter number + name (center display) -->
  <g id="chapter-display">
    <text x="640" y="310" text-anchor="middle" xml:space="preserve" font-family="&quot;Tw Cen MT Condensed Extra Bold&quot;, sans-serif" font-size="160" fill="#F2F2F2" font-weight="bold" font-style="italic">{{CHAPTER_NUM_LARGE}}</text>
    <text x="640" y="410" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="48" fill="#0B88FF" font-weight="bold">{{CHAPTER_TITLE_LARGE}}</text>
  </g>
</svg>
