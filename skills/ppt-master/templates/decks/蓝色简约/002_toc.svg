  <text x="886" y="307" text-anchor="start" xml:space="preserve" font-family="&quot;Tw Cen MT Condensed Extra Bold&quot;, sans-serif" font-size="48" fill="#BFBFBF" font-weight="bold" font-style="italic">{{NUM_05}}</text>
  <text x="918" y="374" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="32" fill="#000000" font-weight="bold" font-style="italic" letter-spacing="2.67">{{CHAPTER_05}}</text>
  <text x="816" y="428" text-anchor="start" xml:space="preserve" font-family="&quot;Tw Cen MT Condensed Extra Bold&quot;, sans-serif" font-size="22" fill="#BFBFBF" font-style="italic">{{CHAPTER_05_EN}}</text>

