  <text x="535" y="374" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="32" fill="#000000" font-weight="bold" font-style="italic" letter-spacing="2.67">{{CHAPTER_03}}</text>
