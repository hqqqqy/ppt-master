  <text x="727" y="374" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="32" fill="#000000" font-weight="bold" font-style="italic" letter-spacing="2.67">{{CHAPTER_04}}</text>
  <text x="626" y="428" text-anchor="start" xml:space="preserve" font-family="&quot;Tw Cen MT Condensed Extra Bold&quot;, sans-serif" font-size="22" fill="#BFBFBF" font-style="italic">{{CHAPTER_04_EN}}</text>

